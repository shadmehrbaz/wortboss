<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wortboss</title>
  <meta name="description" content="Boss fights with your own German vocabulary. Works offline.">
  <meta name="theme-color" content="#1d4a3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wortboss">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- chalk roughness for the monster drawings -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="chalk" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>
  <div id="frame">
    <main id="screen"><div id="boot" lang="de">Wortboss</div></main>
    <nav id="nav" aria-label="Main" hidden></nav>
  </div>
  <noscript><p style="padding:2rem;color:#fff">Wortboss needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
